<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Memory Soccer Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
}

/* TELA INICIAL */
#inicio {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#inicio button {
    margin: 10px;
    padding: 15px 30px;
    font-size: 18px;
}

/* TOPO */
#topo {
    display: none;
    justify-content: space-between;
    padding: 10px 40px;
    font-size: 18px;
}

/* JOGO CENTRAL */
#containerJogo {
    display: none;
    height: calc(100vh - 60px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* GRID */
#game {
    display: grid;
    gap: 15px;
}

/* CARTAS */
.card {
    width: 120px;
    height: 120px;
    perspective: 1000px;
    cursor: pointer;
}

.inner {
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s;
}

.card.flipped .inner {
    transform: rotateY(180deg);
}

.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    backface-visibility: hidden;
}

.front {
    background: #1e90ff;
}

.back {
    transform: rotateY(180deg);
}

.back img {
    width: 100%;
    height: 100%;
    border-radius: 12px;
}

/* BOLAS SEPARADAS */
#bolaP1 {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 30px;
}

#bolaP2 {
    position: fixed;
    top: 10px;
    right: 10px;
    font-size: 30px;
}

/* GAME OVER */
#gameOver {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

button {
    border: none;
    background: #1e90ff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div id="inicio">
    <h1>⚽ Jogo da Memória</h1>
    <button onclick="iniciarJogo(1)">Fácil (9 pares)</button>
    <button onclick="iniciarJogo(2)">Difícil (12 pares)</button>
</div>

<!-- TOPO -->
<div id="topo">
    <div>Jogador 1: <span id="tempo1">30</span>s | Pontos: <span id="p1">0</span></div>
    <div>Jogador 2: <span id="tempo2">30</span>s | Pontos: <span id="p2">0</span></div>
</div>

<div id="bolaP1"></div>
<div id="bolaP2"></div>

<!-- JOGO -->
<div id="containerJogo">
    <div id="game"></div>
</div>

<!-- GAME OVER -->
<div id="gameOver">
    <h1>🏆 Game Over</h1>
    <p id="resultado"></p>
    <button onclick="location.reload()">Jogar novamente</button>
</div>

<script>
let nivel = 1;
let pares = 9;

let cartas = [];
let selecionadas = [];

let jogadorAtual = 1;
let tempo1 = 30;
let tempo2 = 30;

let pontos1 = 0;
let pontos2 = 0;

let intervalo;

function iniciarJogo(nivelEscolhido) {

    document.getElementById("inicio").style.display = "none";
    document.getElementById("topo").style.display = "flex";
    document.getElementById("containerJogo").style.display = "flex";

    nivel = nivelEscolhido;
    pares = (nivel === 1) ? 9 : 12;

    tempo1 = (nivel === 1) ? 30 : 15;
    tempo2 = tempo1;

    document.getElementById("tempo1").innerText = tempo1;
    document.getElementById("tempo2").innerText = tempo2;

    iniciarNivel();
}

function gerarCartas() {
    let base = [];
    for (let i = 1; i <= pares; i++) {
        base.push(i + ".jpg");
    }
    cartas = [...base, ...base];
    cartas.sort(() => Math.random() - 0.5);
}

function iniciarNivel() {

    document.getElementById("bolaP1").innerHTML = "";
    document.getElementById("bolaP2").innerHTML = "";

    gerarCartas();

    const game = document.getElementById("game");
    game.innerHTML = "";

    game.style.gridTemplateColumns = "repeat(6, 120px)";

    cartas.forEach((img) => {

        let card = document.createElement("div");
        card.classList.add("card");
        card.dataset.img = img;

        card.innerHTML = `
            <div class="inner">
                <div class="front"></div>
                <div class="back">
                    <img src="${img}">
                </div>
            </div>
        `;

        card.onclick = () => virarCarta(card);

        game.appendChild(card);
    });

    iniciarTempo();
}

function virarCarta(card) {

    if (selecionadas.length < 2 && !card.classList.contains("flipped")) {

        card.classList.add("flipped");
        selecionadas.push(card);

        if (selecionadas.length === 2) {
            setTimeout(verificar, 600);
        }
    }
}

function verificar() {

    let [c1, c2] = selecionadas;

    if (c1.dataset.img === c2.dataset.img) {

        if (jogadorAtual === 1) {
            pontos1++;
            document.getElementById("p1").innerText = pontos1;
            document.getElementById("bolaP1").innerHTML += "⚽";
        } else {
            pontos2++;
            document.getElementById("p2").innerText = pontos2;
            document.getElementById("bolaP2").innerHTML += "⚽";
        }

    } else {
        c1.classList.remove("flipped");
        c2.classList.remove("flipped");
    }

    selecionadas = [];

    jogadorAtual = jogadorAtual === 1 ? 2 : 1;

    checarFim();
}

function iniciarTempo() {

    clearInterval(intervalo);

    intervalo = setInterval(() => {

        if (jogadorAtual === 1) {
            tempo1--;
            document.getElementById("tempo1").innerText = tempo1;
        } else {
            tempo2--;
            document.getElementById("tempo2").innerText = tempo2;
        }

        if (tempo1 <= 0 && tempo2 <= 0) {
            finalizar();
        }

    }, 1000);
}

function checarFim() {

    if (pontos1 + pontos2 === pares) {
        finalizar();
    }
}

function finalizar() {

    clearInterval(intervalo);

    let resultado = "";

    if (pontos1 > pontos2) resultado = "Jogador 1 venceu!";
    else if (pontos2 > pontos1) resultado = "Jogador 2 venceu!";
    else resultado = "Empate!";

    document.getElementById("resultado").innerText =
        resultado + `\nP1: ${pontos1} | P2: ${pontos2}`;

    document.getElementById("gameOver").style.display = "flex";
}
</script>

</body>
</html>
