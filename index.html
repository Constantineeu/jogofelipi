<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Jogo da Memória - Futebol</title>

  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #0f2740;
      --bg-3: #163b5c;
      --card-front: linear-gradient(145deg, #1e90ff, #1560bd);
      --card-back: #ffffff;
      --accent: #f4c542;
      --accent-2: #ffd95e;
      --text: #ffffff;
      --muted: #c9d7e6;
      --danger: #ff6b6b;
      --glass: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 197, 66, 0.12), transparent 20%),
        radial-gradient(circle at top right, rgba(30, 144, 255, 0.16), transparent 22%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.18;
      pointer-events: none;
    }

    /* TELA INICIAL */
    #inicio {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .inicio-card {
      width: min(720px, 100%);
      background: rgba(8, 20, 36, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 38px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .inicio-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(244, 197, 66, 0.22), transparent 65%);
      top: -60px;
      right: -60px;
      border-radius: 50%;
      pointer-events: none;
    }

    .inicio-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(30, 144, 255, 0.18), transparent 65%);
      bottom: -50px;
      left: -50px;
      border-radius: 50%;
      pointer-events: none;
    }

    .logo {
      font-size: clamp(2rem, 4vw, 3.4rem);
      margin: 0 0 12px;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .subtitulo {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 auto 28px;
      max-width: 560px;
      line-height: 1.5;
    }

    .botoes {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      border: none;
      color: #08111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 14px;
      padding: 15px 26px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 8px 22px rgba(244, 197, 66, 0.28);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.secundario {
      background: linear-gradient(135deg, #2aa8ff, #1e90ff);
      color: white;
      box-shadow: 0 8px 22px rgba(30, 144, 255, 0.25);
    }

    /* ÁREA DO JOGO */
    #areaJogo {
      min-height: 100vh;
      padding: 18px 16px 28px;
      display: none;
    }

    #topo {
      max-width: 1100px;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .player-box,
    .status-box {
      background: rgba(7, 17, 31, 0.62);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .player-box {
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .player-box.ativo {
      border-color: rgba(244, 197, 66, 0.65);
      background: rgba(244, 197, 66, 0.10);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(244, 197, 66, 0.18);
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-title {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .turno-badge {
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      color: var(--muted);
    }

    .player-box.ativo .turno-badge {
      background: rgba(244, 197, 66, 0.18);
      color: #fff4c0;
    }

    .player-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 110px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 0.80rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: bold;
    }

    .tempo-alerta {
      color: #ffd6d6;
    }

    .status-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 190px;
      text-align: center;
    }

    #statusTexto {
      font-size: 1rem;
      font-weight: bold;
      color: #eef7ff;
      line-height: 1.45;
    }

    #containerJogo {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board-wrap {
      width: 100%;
      background: rgba(7, 17, 31, 0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    #game {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 120px));
      justify-content: center;
      gap: 14px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
      border-radius: 18px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s ease;
      border-radius: 18px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .front {
      background: var(--card-front);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        inset 0 2px 12px rgba(255,255,255,0.14),
        0 8px 22px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .front::before {
      content: "⚽";
      font-size: clamp(2rem, 4vw, 2.6rem);
    }

    .back {
      background: #fff;
      transform: rotateY(180deg);
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      border: 2px solid rgba(255,255,255,0.6);
    }

    .back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card.matched {
      animation: pulseMatch 0.7s ease;
    }

    @keyframes pulseMatch {
      0% { transform: scale(1); }
      35% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* TOAST */
    #toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10, 18, 30, 0.92);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s ease;
      z-index: 30;
      text-align: center;
      font-weight: bold;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* GAME OVER */
    #gameOver {
      position: fixed;
      inset: 0;
      background: rgba(1, 7, 15, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }

    .gameover-card {
      width: min(620px, 100%);
      background: linear-gradient(180deg, rgba(9, 21, 37, 0.98), rgba(10, 30, 50, 0.98));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }

    .gameover-title {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 2.8rem);
    }

    .gameover-sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .placares-finais {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 20px 0 24px;
    }

    .placar-final {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
    }

    .placar-final h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .placar-final .numero {
      font-size: 2.3rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .placar-final .tempo-final {
      color: var(--muted);
      font-size: 0.95rem;
    }

    #mensagemFinal {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 18px;
      color: #fff3c2;
    }

    @media (max-width: 900px) {
      #topo {
        grid-template-columns: 1fr;
      }

      .status-box {
        order: -1;
      }

      #game {
        grid-template-columns: repeat(4, minmax(78px, 120px));
      }
    }

    @media (max-width: 560px) {
      #areaJogo {
        padding: 14px 10px 22px;
      }

      .inicio-card {
        padding: 30px 18px;
      }

      .btn {
        width: 100%;
      }

      #game {
        grid-template-columns: repeat(3, minmax(78px, 1fr));
        gap: 10px;
      }

      .board-wrap {
        padding: 14px;
      }

      .player-stats {
        flex-direction: column;
      }

      .placares-finais {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <section id="inicio">
    <div class="inicio-card">
      <h1 class="logo">⚽ Jogo da Memória</h1>
      <p class="subtitulo">Encontre os pares de cartas e marque pontos.</p>

      <div class="botoes">
        <button class="btn" id="btnFacil">Fácil · 9 pares</button>
        <button class="btn secundario" id="btnDificil">Difícil · 12 pares</button>
      </div>
    </div>
  </section>

  <main id="areaJogo">
    <div id="topo">
      <div id="boxP1" class="player-box ativo">
        <div class="player-top">
          <div class="player-title">Jogador 1</div>
          <div class="turno-badge" id="badgeP1">Sua vez</div>
        </div>
        <div class="player-stats">
          <div class="stat">
            <div class="stat-label">Tempo</div>
            <div class="stat-value" id="tempo1">30s</div>
          </div>
          <div class="stat">
            <div class="stat-label">Pontos</div>
            <div class="stat-value" id="p1">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Acertos</div>
            <div class="stat-value" id="bolas1">⚽ x0</div>
          </div>
        </div>
      </div>

      <div class="status-box">
        <div id="statusTexto">Vez do Jogador 1<br>Pares restantes: 9</div>
      </div>

      <div id="boxP2" class="player-box">
        <div class="player-top">
          <div class="player-title">Jogador 2</div>
          <div class="turno-badge" id="badgeP2">Aguardando</div>
        </div>
        <div class="player-stats">
          <div class="stat">
            <div class="stat-label">Tempo</div>
            <div class="stat-value" id="tempo2">30s</div>
          </div>
          <div class="stat">
            <div class="stat-label">Pontos</div>
            <div class="stat-value" id="p2">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Acertos</div>
            <div class="stat-value" id="bolas2">⚽ x0</div>
          </div>
        </div>
      </div>
    </div>

    <div id="containerJogo">
      <div class="board-wrap">
        <div id="game"></div>
      </div>
    </div>
  </main>

  <div id="gameOver">
    <div class="gameover-card">
      <h1 class="gameover-title">🏆 Game Over</h1>
      <p class="gameover-sub" id="motivoFinal">Fim de partida</p>
      <div id="mensagemFinal"></div>

      <div class="placares-finais">
        <div class="placar-final">
          <h3>Jogador 1</h3>
          <div class="numero" id="finalP1">0</div>
          <div class="tempo-final" id="finalT1">Tempo restante: 0s</div>
        </div>

        <div class="placar-final">
          <h3>Jogador 2</h3>
          <div class="numero" id="finalP2">0</div>
          <div class="tempo-final" id="finalT2">Tempo restante: 0s</div>
        </div>
      </div>

      <button class="btn" id="btnReiniciar">Jogar novamente</button>
    </div>
  </div>

  <script>
    let nivel = 1;
    let pares = 9;
    let deck = [];
    let selecionadas = [];
    let bloqueado = false;
    let jogadorAtual = 1;
    let tempo1 = 30;
    let tempo2 = 30;
    let pontos1 = 0;
    let pontos2 = 0;
    let paresEncontrados = 0;
    let intervalo = null;
    let jogoFinalizado = false;

    const inicio = document.getElementById("inicio");
    const areaJogo = document.getElementById("areaJogo");
    const game = document.getElementById("game");
    const toast = document.getElementById("toast");

    document.getElementById("btnFacil").addEventListener("click", () => iniciarJogo(1));
    document.getElementById("btnDificil").addEventListener("click", () => iniciarJogo(2));
    document.getElementById("btnReiniciar").addEventListener("click", reiniciarTudo);

    function embaralhar(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function mostrarToast(mensagem) {
      toast.textContent = mensagem;
      toast.classList.add("show");

      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function iniciarJogo(nivelEscolhido) {
      nivel = nivelEscolhido;
      pares = nivel === 1 ? 9 : 12;

      tempo1 = nivel === 1 ? 30 : 15;
      tempo2 = nivel === 1 ? 30 : 15;

      pontos1 = 0;
      pontos2 = 0;
      paresEncontrados = 0;
      jogadorAtual = 1;
      deck = [];
      selecionadas = [];
      bloqueado = false;
      jogoFinalizado = false;

      inicio.style.display = "none";
      areaJogo.style.display = "block";
      document.getElementById("gameOver").style.display = "none";

      criarCartas();
      renderizarTabuleiro();
      atualizarHUD();
      iniciarTempo();

      mostrarToast("Partida iniciada! Vez do Jogador 1.");
    }

    function criarCartas() {
      const base = [];
      for (let i = 1; i <= pares; i++) {
        base.push(`${i}.jpg`);
      }

      const duplicadas = [...base, ...base];
      deck = embaralhar(duplicadas).map((img, index) => ({
        id: index,
        img
      }));
    }

    function renderizarTabuleiro() {
      game.innerHTML = "";

      deck.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = item.id;
        card.dataset.img = item.img;
        card.dataset.matched = "false";

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face front"></div>
            <div class="card-face back">
              <img src="${item.img}" alt="Carta do jogo">
            </div>
          </div>
        `;

        card.addEventListener("click", () => virarCarta(card));
        game.appendChild(card);
      });
    }

    function virarCarta(card) {
      if (jogoFinalizado || bloqueado) return;
      if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
      if ((jogadorAtual === 1 && tempo1 <= 0) || (jogadorAtual === 2 && tempo2 <= 0)) return;
      if (selecionadas.length === 2) return;

      card.classList.add("flipped");
      selecionadas.push(card);

      if (selecionadas.length === 2) {
        bloqueado = true;
        setTimeout(verificarPar, 800);
      }
    }

    function verificarPar() {
      const [c1, c2] = selecionadas;
      if (!c1 || !c2) {
        bloqueado = false;
        return;
      }

      const acertou = c1.dataset.img === c2.dataset.img;

      if (acertou) {
        c1.classList.add("matched");
        c2.classList.add("matched");
        paresEncontrados++;

        if (jogadorAtual === 1) pontos1++;
        else pontos2++;

        selecionadas = [];
        bloqueado = false;
        atualizarHUD();
        mostrarToast(`Jogador ${jogadorAtual} encontrou um par!`);

        if (paresEncontrados === pares) {
          finalizarJogo("Todos os pares foram encontrados!");
          return;
        }

        trocarJogador();
      } else {
        setTimeout(() => {
          c1.classList.remove("flipped");
          c2.classList.remove("flipped");
          selecionadas = [];
          bloqueado = false;
          trocarJogador();
        }, 350);
      }
    }

    function trocarJogador() {
      if (jogoFinalizado) return;

      const proximo = jogadorAtual === 1 ? 2 : 1;
      const tempoProximo = proximo === 1 ? tempo1 : tempo2;
      const tempoAtual = jogadorAtual === 1 ? tempo1 : tempo2;

      if (tempoProximo > 0) {
        jogadorAtual = proximo;
      } else if (tempoAtual > 0) {
        mostrarToast(`Jogador ${proximo} está sem tempo.`);
      } else {
        finalizarJogo("Os dois tempos acabaram!");
        return;
      }

      atualizarHUD();
    }

    function iniciarTempo() {
      clearInterval(intervalo);

      intervalo = setInterval(() => {
        if (jogoFinalizado) return;

        if (jogadorAtual === 1) {
          if (tempo1 > 0) tempo1--;

          if (tempo1 <= 0) {
            tempo1 = 0;
            atualizarHUD();
            mostrarToast("Tempo esgotado do Jogador 1!");

            if (tempo2 <= 0) {
              finalizarJogo("Os dois tempos acabaram!");
              return;
            }

            jogadorAtual = 2;
          }
        } else {
          if (tempo2 > 0) tempo2--;

          if (tempo2 <= 0) {
            tempo2 = 0;
            atualizarHUD();
            mostrarToast("Tempo esgotado do Jogador 2!");

            if (tempo1 <= 0) {
              finalizarJogo("Os dois tempos acabaram!");
              return;
            }

            jogadorAtual = 1;
          }
        }

        atualizarHUD();
      }, 1000);
    }

    function atualizarHUD() {
      document.getElementById("tempo1").textContent = `${tempo1}s`;
      document.getElementById("tempo2").textContent = `${tempo2}s`;
      document.getElementById("p1").textContent = pontos1;
      document.getElementById("p2").textContent = pontos2;
      document.getElementById("bolas1").textContent = `⚽ x${pontos1}`;
      document.getElementById("bolas2").textContent = `⚽ x${pontos2}`;

      const boxP1 = document.getElementById("boxP1");
      const boxP2 = document.getElementById("boxP2");
      const badgeP1 = document.getElementById("badgeP1");
      const badgeP2 = document.getElementById("badgeP2");

      boxP1.classList.toggle("ativo", jogadorAtual === 1 && !jogoFinalizado && tempo1 > 0);
      boxP2.classList.toggle("ativo", jogadorAtual === 2 && !jogoFinalizado && tempo2 > 0);

      badgeP1.textContent = (jogadorAtual === 1 && tempo1 > 0 && !jogoFinalizado) ? "Sua vez" : (tempo1 <= 0 ? "Sem tempo" : "Aguardando");
      badgeP2.textContent = (jogadorAtual === 2 && tempo2 > 0 && !jogoFinalizado) ? "Sua vez" : (tempo2 <= 0 ? "Sem tempo" : "Aguardando");

      document.getElementById("tempo1").classList.toggle("tempo-alerta", tempo1 <= 5);
      document.getElementById("tempo2").classList.toggle("tempo-alerta", tempo2 <= 5);

      const restantes = pares - paresEncontrados;
      let textoStatus = `Vez do Jogador ${jogadorAtual}<br>Pares restantes: ${restantes}`;

      if (tempo1 <= 0 && tempo2 > 0) {
        textoStatus = `Jogador 1 sem tempo<br>Vez do Jogador 2`;
      } else if (tempo2 <= 0 && tempo1 > 0) {
        textoStatus = `Jogador 2 sem tempo<br>Vez do Jogador 1`;
      } else if (tempo1 <= 0 && tempo2 <= 0) {
        textoStatus = `Tempos encerrados<br>Fim da partida`;
      }

      document.getElementById("statusTexto").innerHTML = textoStatus;
    }

    function finalizarJogo(motivo) {
      if (jogoFinalizado) return;

      jogoFinalizado = true;
      clearInterval(intervalo);
      bloqueado = true;

      let mensagem = "";
      if (pontos1 > pontos2) mensagem = "🏅 Jogador 1 venceu!";
      else if (pontos2 > pontos1) mensagem = "🏅 Jogador 2 venceu!";
      else mensagem = "🤝 Empate!";

      document.getElementById("motivoFinal").textContent = motivo;
      document.getElementById("mensagemFinal").textContent =
        `${mensagem} | Pontuação final — Jogador 1: ${pontos1} x Jogador 2: ${pontos2}`;

      document.getElementById("finalP1").textContent = pontos1;
      document.getElementById("finalP2").textContent = pontos2;
      document.getElementById("finalT1").textContent = `Tempo restante: ${tempo1}s`;
      document.getElementById("finalT2").textContent = `Tempo restante: ${tempo2}s`;

      document.getElementById("gameOver").style.display = "flex";
      atualizarHUD();
    }

    function reiniciarTudo() {
      clearInterval(intervalo);
      game.innerHTML = "";
      document.getElementById("gameOver").style.display = "none";
      areaJogo.style.display = "none";
      inicio.style.display = "flex";
    }
  </script>
</body>
</html>
