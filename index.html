<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Memory Soccer Game</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 10px;
}

#topo {
    display: flex;
    justify-content: space-around;
    margin: 10px;
    font-size: 18px;
}

#game {
    display: grid;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
}

.card {
    width: 90px;
    height: 90px;
    perspective: 1000px;
    cursor: pointer;
}

.inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
}

.card.flipped .inner {
    transform: rotateY(180deg);
}

.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    backface-visibility: hidden;
}

.front {
    background: #1e90ff;
}

.back {
    transform: rotateY(180deg);
}

.back img {
    width: 100%;
    height: 100%;
    border-radius: 10px;
}

#bolaArea {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 25px;
}

#gameOver {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

button {
    padding: 10px 20px;
    border: none;
    background: #1e90ff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>⚽ Jogo da Memória</h1>

<div id="topo">
    <div>Jogador 1: <span id="tempo1">30</span>s | Pontos: <span id="p1">0</span></div>
    <div>Jogador 2: <span id="tempo2">30</span>s | Pontos: <span id="p2">0</span></div>
</div>

<div id="bolaArea"></div>

<div id="game"></div>

<div id="gameOver">
    <h1>🏆 Game Over</h1>
    <p id="resultado"></p>
    <button onclick="location.reload()">Jogar novamente</button>
</div>

<script>
let nivel = 1;
let pares = 9;

let cartas = [];
let selecionadas = [];

let jogadorAtual = 1;
let tempo1 = 30;
let tempo2 = 30;

let pontos1 = 0;
let pontos2 = 0;

let intervalo;

// cria lista de imagens: 1.jpg até 12.jpg
function gerarCartas() {
    let base = [];
    for (let i = 1; i <= pares; i++) {
        base.push(i + ".jpg");
    }
    cartas = [...base, ...base];
    cartas.sort(() => Math.random() - 0.5);
}

function iniciarNivel() {

    document.getElementById("bolaArea").innerHTML = "";

    gerarCartas();

    const game = document.getElementById("game");
    game.innerHTML = "";

    game.style.gridTemplateColumns = "repeat(6, 90px)";

    cartas.forEach((img, index) => {

        let card = document.createElement("div");
        card.classList.add("card");
        card.dataset.img = img;

        card.innerHTML = `
            <div class="inner">
                <div class="front"></div>
                <div class="back">
                    <img src="${img}">
                </div>
            </div>
        `;

        card.onclick = () => virarCarta(card);

        game.appendChild(card);
    });

    iniciarTempo();
}

function virarCarta(card) {

    if (selecionadas.length < 2 && !card.classList.contains("flipped")) {

        card.classList.add("flipped");
        selecionadas.push(card);

        if (selecionadas.length === 2) {
            setTimeout(verificar, 600);
        }
    }
}

function verificar() {

    let [c1, c2] = selecionadas;

    if (c1.dataset.img === c2.dataset.img) {

        if (jogadorAtual === 1) {
            pontos1++;
            document.getElementById("p1").innerText = pontos1;
        } else {
            pontos2++;
            document.getElementById("p2").innerText = pontos2;
        }

        document.getElementById("bolaArea").innerHTML += "⚽";

    } else {
        c1.classList.remove("flipped");
        c2.classList.remove("flipped");
    }

    selecionadas = [];

    trocarJogador();
    checarFim();
}

function trocarJogador() {
    jogadorAtual = jogadorAtual === 1 ? 2 : 1;
}

function iniciarTempo() {

    clearInterval(intervalo);

    intervalo = setInterval(() => {

        if (jogadorAtual === 1) {
            tempo1--;
            document.getElementById("tempo1").innerText = tempo1;
        } else {
            tempo2--;
            document.getElementById("tempo2").innerText = tempo2;
        }

        if (tempo1 <= 0 && tempo2 <= 0) {
            finalizar();
        }

    }, 1000);
}

function checarFim() {

    if (pontos1 + pontos2 === pares) {

        if (nivel === 1) {

            nivel = 2;
            pares = 12;

            tempo1 = 15;
            tempo2 = 15;

            document.getElementById("tempo1").innerText = tempo1;
            document.getElementById("tempo2").innerText = tempo2;

            iniciarNivel();

        } else {
            finalizar();
        }
    }
}

function finalizar() {

    clearInterval(intervalo);

    let resultado = "";

    if (pontos1 > pontos2) resultado = "Jogador 1 venceu!";
    else if (pontos2 > pontos1) resultado = "Jogador 2 venceu!";
    else resultado = "Empate!";

    document.getElementById("resultado").innerText =
        resultado + `\nP1: ${pontos1} | P2: ${pontos2}`;

    document.getElementById("gameOver").style.display = "flex";
}

iniciarNivel();
</script>

</body>
</html>
