<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ Jogo da Memória - Futebol</title>

  <style>
    :root {
      --bg-1: #07111f;
      --bg-2: #0f2740;
      --bg-3: #163b5c;
      --card-front: linear-gradient(145deg, #1e90ff, #1560bd);
      --card-back: #ffffff;
      --accent: #f4c542;
      --accent-2: #ffd95e;
      --text: #ffffff;
      --muted: #c9d7e6;
      --glass: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 197, 66, 0.12), transparent 20%),
        radial-gradient(circle at top right, rgba(30, 144, 255, 0.16), transparent 22%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.18;
      pointer-events: none;
    }

    #inicio {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .inicio-card {
      width: min(720px, 100%);
      background: rgba(8, 20, 36, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 38px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .inicio-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(244, 197, 66, 0.22), transparent 65%);
      top: -60px;
      right: -60px;
      border-radius: 50%;
      pointer-events: none;
    }

    .inicio-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(30, 144, 255, 0.18), transparent 65%);
      bottom: -50px;
      left: -50px;
      border-radius: 50%;
      pointer-events: none;
    }

    .logo {
      font-size: clamp(2rem, 4vw, 3.4rem);
      margin: 0 0 12px;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .subtitulo {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 auto 28px;
      max-width: 560px;
      line-height: 1.5;
    }

    .campos {
      display: grid;
      gap: 14px;
      max-width: 420px;
      margin: 0 auto 20px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 8px;
    }

    .campo label {
      font-weight: bold;
      color: #fff;
    }

    .campo input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .campo input::placeholder {
      color: #c9d7e6;
    }

    .botoes {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      border: none;
      color: #08111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 14px;
      padding: 15px 26px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 8px 22px rgba(244, 197, 66, 0.28);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.secundario {
      background: linear-gradient(135deg, #2aa8ff, #1e90ff);
      color: white;
      box-shadow: 0 8px 22px rgba(30, 144, 255, 0.25);
    }

    #areaJogo {
      min-height: 100vh;
      padding: 18px 16px 28px;
      display: none;
    }

    #topo {
      max-width: 1100px;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .player-box,
    .status-box {
      background: rgba(7, 17, 31, 0.62);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .player-box {
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .player-box.ativo {
      border-color: rgba(244, 197, 66, 0.65);
      background: rgba(244, 197, 66, 0.10);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(244, 197, 66, 0.18);
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-title {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .turno-badge {
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      color: var(--muted);
    }

    .player-box.ativo .turno-badge {
      background: rgba(244, 197, 66, 0.18);
      color: #fff4c0;
    }

    .player-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 110px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 0.80rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: bold;
    }

    .status-box {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 190px;
      text-align: center;
    }

    #statusTexto {
      font-size: 1rem;
      font-weight: bold;
      color: #eef7ff;
      line-height: 1.45;
    }

    #containerJogo {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board-wrap {
      width: 100%;
      background: rgba(7, 17, 31, 0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    #game {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 120px));
      justify-content: center;
      gap: 14px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      perspective: 1000px;
      cursor: pointer;
      border-radius: 18px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s ease;
      border-radius: 18px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .front {
      background: var(--card-front);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        inset 0 2px 12px rgba(255,255,255,0.14),
        0 8px 22px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .front::before {
      content: "⚽";
      font-size: clamp(2rem, 4vw, 2.6rem);
    }

    .back {
      background: #fff;
      transform: rotateY(180deg);
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      border: 2px solid rgba(255,255,255,0.6);
    }

    .back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card.matched {
      animation: pulseMatch 0.7s ease;
    }

    @keyframes pulseMatch {
      0% { transform: scale(1); }
      35% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10, 18, 30, 0.92);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s ease;
      z-index: 30;
      text-align: center;
      font-weight: bold;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #modalMensagem,
    #gameOver {
      position: fixed;
      inset: 0;
      background: rgba(1, 7, 15, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-card,
    .gameover-card {
      width: min(620px, 100%);
      background: linear-gradient(180deg, rgba(9, 21, 37, 0.98), rgba(10, 30, 50, 0.98));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }

    .modal-card h2,
    .gameover-title {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .modal-card p,
    .gameover-sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .placares-finais {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 20px 0 24px;
    }

    .placar-final {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
    }

    .placar-final h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .placar-final .numero {
      font-size: 2.3rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .placar-final .info-final {
      color: var(--muted);
      font-size: 0.95rem;
    }

    #mensagemFinal {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 18px;
      color: #fff3c2;
    }

    @media (max-width: 900px) {
      #topo {
        grid-template-columns: 1fr;
      }

      .status-box {
        order: -1;
      }

      #game {
        grid-template-columns: repeat(4, minmax(78px, 120px));
      }
    }

    @media (max-width: 560px) {
      #areaJogo {
        padding: 14px 10px 22px;
      }

      .inicio-card {
        padding: 30px 18px;
      }

      .btn {
        width: 100%;
      }

      #game {
        grid-template-columns: repeat(3, minmax(78px, 1fr));
        gap: 10px;
      }

      .board-wrap {
        padding: 14px;
      }

      .player-stats {
        flex-direction: column;
      }

      .placares-finais {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <section id="inicio">
    <div class="inicio-card">
      <h1 class="logo">⚽ Jogo da Memória</h1>
      <p class="subtitulo">Digite os nomes dos jogadores e clique em jogar.</p>

      <div class="campos">
        <div class="campo">
          <label for="nome1">Nome do Jogador 1</label>
          <input id="nome1" type="text" placeholder="Digite o nome do Jogador 1" />
        </div>

        <div class="campo">
          <label for="nome2">Nome do Jogador 2</label>
          <input id="nome2" type="text" placeholder="Digite o nome do Jogador 2" />
        </div>
      </div>

      <div class="botoes">
        <button class="btn" id="btnJogar">Jogar</button>
      </div>
    </div>
  </section>

  <main id="areaJogo">
    <div id="topo">
      <div id="boxP1" class="player-box ativo">
        <div class="player-top">
          <div class="player-title" id="tituloJogador1">Jogador 1</div>
          <div class="turno-badge" id="badgeP1">Sua vez</div>
        </div>
        <div class="player-stats">
          <div class="stat">
            <div class="stat-label">Pontos</div>
            <div class="stat-value" id="p1">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Bolinhas</div>
            <div class="stat-value" id="bolas1">⚽ x0</div>
          </div>
        </div>
      </div>

      <div class="status-box">
        <div id="statusTexto">Vez de Jogador 1<br>Pares restantes: 9</div>
      </div>

      <div id="boxP2" class="player-box">
        <div class="player-top">
          <div class="player-title" id="tituloJogador2">Jogador 2</div>
          <div class="turno-badge" id="badgeP2">Aguardando</div>
        </div>
        <div class="player-stats">
          <div class="stat">
            <div class="stat-label">Pontos</div>
            <div class="stat-value" id="p2">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Bolinhas</div>
            <div class="stat-value" id="bolas2">⚽ x0</div>
          </div>
        </div>
      </div>
    </div>

    <div id="containerJogo">
      <div class="board-wrap">
        <div id="game"></div>
      </div>
    </div>
  </main>

  <div id="modalMensagem">
    <div class="modal-card">
      <h2 id="modalTitulo">Mensagem</h2>
      <p id="modalTexto">Texto</p>
      <button class="btn" id="modalOk">OK</button>
    </div>
  </div>

  <div id="gameOver">
    <div class="gameover-card">
      <h1 class="gameover-title">🏆 Fim da Partida</h1>
      <p class="gameover-sub" id="motivoFinal">Partida encerrada</p>
      <div id="mensagemFinal"></div>

      <div class="placares-finais">
        <div class="placar-final">
          <h3 id="finalNome1">Jogador 1</h3>
          <div class="numero" id="finalP1">0</div>
          <div class="info-final" id="finalB1">⚽ x0</div>
        </div>

        <div class="placar-final">
          <h3 id="finalNome2">Jogador 2</h3>
          <div class="numero" id="finalP2">0</div>
          <div class="info-final" id="finalB2">⚽ x0</div>
        </div>
      </div>

      <button class="btn" id="btnReiniciar">Jogar novamente</button>
    </div>
  </div>

  <audio id="musicaFundo" src="musica.mp3" loop preload="auto"></audio>

  <script>
    const CONFIG = {
      facil: 9,
      dificil: 12
    };

    let nivelAtual = 1; // interno: 1 = fácil, 2 = difícil
    let pares = CONFIG.facil;
    let deck = [];
    let selecionadas = [];
    let bloqueado = false;
    let jogadorAtual = 1;
    let jogadorInicialRodada = 1;
    let pontos1 = 0;
    let pontos2 = 0;
    let paresEncontrados = 0;
    let jogoTravado = false;
    let nomes = {
      1: "Jogador 1",
      2: "Jogador 2"
    };
    let modalCallback = null;

    const inicio = document.getElementById("inicio");
    const areaJogo = document.getElementById("areaJogo");
    const game = document.getElementById("game");
    const toast = document.getElementById("toast");
    const musicaFundo = document.getElementById("musicaFundo");

    document.getElementById("btnJogar").addEventListener("click", iniciarPartida);
    document.getElementById("btnReiniciar").addEventListener("click", reiniciarTudo);
    document.getElementById("modalOk").addEventListener("click", fecharModal);

    function embaralhar(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function mostrarToast(mensagem) {
      toast.textContent = mensagem;
      toast.classList.add("show");

      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function tocarMusica() {
      musicaFundo.currentTime = 0;
      musicaFundo.play().catch(() => {});
    }

    function pararMusica() {
      musicaFundo.pause();
      musicaFundo.currentTime = 0;
    }

    function abrirModal(titulo, texto, callback = null) {
      jogoTravado = true;
      modalCallback = callback;
      document.getElementById("modalTitulo").textContent = titulo;
      document.getElementById("modalTexto").textContent = texto;
      document.getElementById("modalMensagem").style.display = "flex";
    }

    function fecharModal() {
      document.getElementById("modalMensagem").style.display = "none";
      const acao = modalCallback;
      modalCallback = null;
      jogoTravado = false;
      if (typeof acao === "function") acao();
    }

    function iniciarPartida() {
      const nome1 = document.getElementById("nome1").value.trim();
      const nome2 = document.getElementById("nome2").value.trim();

      if (!nome1 || !nome2) {
        mostrarToast("Digite o nome dos dois jogadores.");
        return;
      }

      nomes[1] = nome1;
      nomes[2] = nome2;

      pontos1 = 0;
      pontos2 = 0;
      nivelAtual = 1;
      jogadorInicialRodada = 1;
      bloqueado = false;
      selecionadas = [];
      deck = [];

      document.getElementById("tituloJogador1").textContent = nomes[1];
      document.getElementById("tituloJogador2").textContent = nomes[2];

      inicio.style.display = "none";
      areaJogo.style.display = "block";
      document.getElementById("gameOver").style.display = "none";

      tocarMusica();
      prepararRodada();
      mostrarToast("Partida iniciada!");
    }

    function prepararRodada() {
      pares = nivelAtual === 1 ? CONFIG.facil : CONFIG.dificil;
      paresEncontrados = 0;
      selecionadas = [];
      deck = [];
      bloqueado = false;
      jogadorAtual = jogadorInicialRodada;
      jogadorInicialRodada = jogadorInicialRodada === 1 ? 2 : 1;

      criarCartas();
      renderizarTabuleiro();
      atualizarHUD();
    }

    function criarCartas() {
      const base = [];
      for (let i = 1; i <= pares; i++) {
        base.push(`${i}.jpg`);
      }

      const duplicadas = [...base, ...base];
      deck = embaralhar(duplicadas).map((img, index) => ({
        id: index,
        img
      }));
    }

    function renderizarTabuleiro() {
      game.innerHTML = "";

      deck.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = item.id;
        card.dataset.img = item.img;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face front"></div>
            <div class="card-face back">
              <img src="${item.img}" alt="Carta do jogo">
            </div>
          </div>
        `;

        card.addEventListener("click", () => virarCarta(card));
        game.appendChild(card);
      });
    }

    function virarCarta(card) {
      if (jogoTravado || bloqueado) return;
      if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
      if (selecionadas.length === 2) return;

      card.classList.add("flipped");
      selecionadas.push(card);

      if (selecionadas.length === 2) {
        bloqueado = true;
        setTimeout(verificarPar, 700);
      }
    }

    function verificarPar() {
      const [c1, c2] = selecionadas;
      if (!c1 || !c2) {
        bloqueado = false;
        return;
      }

      const acertou = c1.dataset.img === c2.dataset.img;

      if (acertou) {
        c1.classList.add("matched");
        c2.classList.add("matched");
        paresEncontrados++;

        if (jogadorAtual === 1) pontos1++;
        else pontos2++;

        selecionadas = [];
        bloqueado = false;

        atualizarHUD();
        mostrarToast(`${nomes[jogadorAtual]} encontrou um par e joga novamente!`);

        if (paresEncontrados === pares) {
          encerrarRodada();
        }
      } else {
        setTimeout(() => {
          c1.classList.remove("flipped");
          c2.classList.remove("flipped");
          selecionadas = [];
          bloqueado = false;
          trocarJogador();
        }, 350);
      }
    }

    function trocarJogador() {
      jogadorAtual = jogadorAtual === 1 ? 2 : 1;
      atualizarHUD();
    }

    function atualizarHUD() {
      document.getElementById("p1").textContent = pontos1;
      document.getElementById("p2").textContent = pontos2;
      document.getElementById("bolas1").textContent = `⚽ x${pontos1}`;
      document.getElementById("bolas2").textContent = `⚽ x${pontos2}`;

      const boxP1 = document.getElementById("boxP1");
      const boxP2 = document.getElementById("boxP2");
      const badgeP1 = document.getElementById("badgeP1");
      const badgeP2 = document.getElementById("badgeP2");

      boxP1.classList.toggle("ativo", jogadorAtual === 1 && !jogoTravado);
      boxP2.classList.toggle("ativo", jogadorAtual === 2 && !jogoTravado);

      badgeP1.textContent = jogadorAtual === 1 && !jogoTravado ? "Sua vez" : "Aguardando";
      badgeP2.textContent = jogadorAtual === 2 && !jogoTravado ? "Sua vez" : "Aguardando";

      const restantes = pares - paresEncontrados;
      document.getElementById("statusTexto").innerHTML =
        `Vez de ${nomes[jogadorAtual]}<br>Pares restantes: ${restantes}`;
    }

    function encerrarRodada() {
      bloqueado = true;

      if (nivelAtual === 1) {
        abrirModal("Parabéns!", "Você passou de nível!", () => {
          nivelAtual = 2;
          prepararRodada();
          mostrarToast("Nova rodada iniciada!");
        });
        return;
      }

      if (pontos1 === pontos2) {
        abrirModal("Empate!", "Vamos desempatar!", () => {
          nivelAtual = 2;
          prepararRodada();
          mostrarToast("Desempate iniciado!");
        });
        return;
      }

      finalizarPartida();
    }

    function finalizarPartida() {
      pararMusica();
      bloqueado = true;
      jogoTravado = true;

      let mensagem = "";

      if (pontos1 > pontos2) {
        mensagem = `${nomes[1]} ganhou e ${nomes[2]} perdeu!`;
      } else {
        mensagem = `${nomes[2]} ganhou e ${nomes[1]} perdeu!`;
      }

      document.getElementById("motivoFinal").textContent = "Pontuação total da partida";
      document.getElementById("mensagemFinal").textContent =
        `${mensagem} Placar final: ${pontos1} x ${pontos2}`;

      document.getElementById("finalNome1").textContent = nomes[1];
      document.getElementById("finalNome2").textContent = nomes[2];
      document.getElementById("finalP1").textContent = pontos1;
      document.getElementById("finalP2").textContent = pontos2;
      document.getElementById("finalB1").textContent = `⚽ x${pontos1}`;
      document.getElementById("finalB2").textContent = `⚽ x${pontos2}`;

      document.getElementById("gameOver").style.display = "flex";
    }

    function reiniciarTudo() {
      pararMusica();
      bloqueado = false;
      jogoTravado = false;
      deck = [];
      selecionadas = [];
      game.innerHTML = "";

      document.getElementById("gameOver").style.display = "none";
      document.getElementById("modalMensagem").style.display = "none";

      document.getElementById("nome1").value = "";
      document.getElementById("nome2").value = "";

      areaJogo.style.display = "none";
      inicio.style.display = "flex";
    }
  </script>
</body>
</html>
